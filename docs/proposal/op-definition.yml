# Sociodemographic variables
- Category: "Sociodemographic"
  Variable: "Age"
  Definition: "Age of respondent in years at the time of the online survey"
  Scale: "Numeric"
- Category: "Sociodemographic"
  Variable: "Sex"
  Definition: "Biological sex of the respondent (self-reported)"
  Scale: "Categorical (0: Male, 1: Female)"
- Category: "Sociodemographic"
  Variable: "Marital Status"
  Definition: "Legal marital status; divorced categorized as not married"
  Scale: "Categorical (0: Not married, 1: Married)"
- Category: "Sociodemographic"
  Variable: "Domicile"
  Definition: "Province of residence"
  Scale: "Categorical (0: Jakarta, 1: West Java, 2: East Java, 3: Others)"

# Work-related and stress factors
- Category: "Work and Stress Factors"
  Variable: "Employment Status"
  Definition: "Current employment status (full-time, part-time, unemployed)"
  Scale: "Categorical (0: Working, 1: Unemployed-seeking job, 2: Unemployed-not seeking job, 3: Not working)"
- Category: "Work and Stress Factors"
  Variable: "Years Working"
  Definition: "Cumulative number of years worked since legal working age (15 years)"
  Scale: "Numeric"
- Category: "Work and Stress Factors"
  Variable: "Job Level"
  Definition: "Employment hierarchy level within the organization"
  Scale: "Categorical (0: Entry level, 1: Intermediate, 2: Supervisor, 3: Manager, 4: Executive)"
- Category: "Work and Stress Factors"
  Variable: "Monthly Expense"
  Definition: "Monthly expense range per capita in Indonesian Rupiah (IDR)"
  Scale: "Categorical (0: <500K, 1: 600-700K, 2: 800-900K, 3: 1.0-1.2M, 4: 1.3-1.5M, 5: 1.6-1.8M, 6: 2.0-2.3M, 7: 2.5-3.0M, 8: 3.5-4.5M, 9: >5M)"

# Mental health outcomes
- Category: "Mental Health Outcomes"
  Variable: "Perceived Stress"
  Definition: "Total score of Perceived Stress Scale 10"
  Scale: "Numeric"
- Category: "Mental Health Outcomes"
  Variable: "Depression"
  Definition: "Total score of Patient Health Questionnaire 9"
  Scale: "Numeric"
- Category: "Mental Health Outcomes"
  Variable: "Anxiety"
  Definition: "Total score of Generalized Anxiety Disorder 7"
  Scale: "Numeric"
- Category: "Mental Health Outcomes"
  Variable: "Burnout"
  Definition: "Total score of Maslach Burnout Inventory"
  Scale: "Numeric"
